name: Vérifier les programmes

on:
  schedule:
    - cron: "15 7 * * *"
  workflow_dispatch:
    inputs:
      test_notification:
        description: "Envoyer une notification de test au lieu d'attendre un nouveau programme"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Vérifier les PDF
        shell: bash
        run: |
          python - <<'PY'
          import datetime
          import json
          import urllib.request

          WIDGET_URL = "https://www.mediatheque-portdebouc.com/widget/render-all/profile_id/1/widget_id/20"

          MONTHS = [
              "Janvier", "Février", "Mars", "Avril",
              "Mai", "Juin", "Juillet", "Août",
              "Septembre", "Octobre", "Novembre", "Décembre"
          ]

          import re
          from html.parser import HTMLParser
          from urllib.parse import urljoin
          import unicodedata

          class LinkParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.links = []
                  self._current = None

              def handle_starttag(self, tag, attrs):
                  if tag.lower() == "a":
                      attrs = dict(attrs)
                      self._current = {
                          "href": attrs.get("href"),
                          "text": []
                      }

              def handle_data(self, data):
                  if self._current is not None:
                      self._current["text"].append(data)

              def handle_endtag(self, tag):
                  if tag.lower() == "a" and self._current is not None:
                      self._current["text"] = " ".join(self._current["text"]).strip()
                      self.links.append(self._current)
                      self._current = None

          def normalize(value):
              value = unicodedata.normalize("NFD", value or "")
              value = "".join(c for c in value if unicodedata.category(c) != "Mn")
              return value.lower()

          def fetch_page():
              request = urllib.request.Request(
                  WIDGET_URL,
                  headers={"User-Agent": "programme-mediatheque-check/2.0"}
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  return response.read().decode("utf-8", errors="replace")

          def verify_pdf(url):
              try:
                  request = urllib.request.Request(
                      url,
                      headers={
                          "User-Agent": "programme-mediatheque-check/2.0",
                          "Range": "bytes=0-1023"
                      }
                  )
                  with urllib.request.urlopen(request, timeout=30) as response:
                      if not (200 <= response.status < 400):
                          return False
                      content_type = (response.headers.get("Content-Type") or "").lower()
                      first_bytes = response.read(1024)
                      return (
                          "pdf" in content_type
                          or first_bytes.startswith(b"%PDF")
                          or url.lower().split("?")[0].endswith(".pdf")
                      )
              except Exception:
                  return False

          def find_program(date, links):
              month = normalize(MONTHS[date.month - 1])
              label = f"{MONTHS[date.month - 1]} {date.year}"
              target = normalize(label)

              candidates = []
              for link in links:
                  href = link.get("href")
                  if not href:
                      continue

                  absolute = urljoin(WIDGET_URL, href)
                  text = normalize(link.get("text", ""))
                  haystack = f"{text} {normalize(absolute)}"

                  score = 0
                  if target in haystack:
                      score += 100
                  if str(date.year) in haystack:
                      score += 30
                  if month in haystack:
                      score += 30
                  if absolute.lower().split("?")[0].endswith(".pdf"):
                      score += 10

                  if score >= 60:
                      candidates.append((score, absolute))

              candidates.sort(reverse=True)

              seen = set()
              for _, url in candidates:
                  if url in seen:
                      continue
                  seen.add(url)
                  if verify_pdf(url):
                      return {
                          "year": date.year,
                          "month": date.month,
                          "label": label,
                          "url": url,
                          "available": True
                      }

              return {
                  "year": date.year,
                  "month": date.month,
                  "label": label,
                  "url": "",
                  "available": False
              }

          today = datetime.date.today()
          current = today.replace(day=1)

          if current.month == 12:
              next_month = datetime.date(current.year + 1, 1, 1)
          else:
              next_month = datetime.date(current.year, current.month + 1, 1)

          try:
              html = fetch_page()
              parser = LinkParser()
              parser.feed(html)
              links = parser.links
              print(f"Liens trouvés sur la page des programmes: {len(links)}")
          except Exception as error:
              print(f"Impossible de lire la page des programmes: {error}")
              links = []

          data = {
              "current": find_program(current, links),
              "next": find_program(next_month, links)
          }

          with open("program.json", "w", encoding="utf-8") as file:
              json.dump(
                  data,
                  file,
                  ensure_ascii=False,
                  indent=2
              )
              file.write("\n")

          print(json.dumps(data, ensure_ascii=False, indent=2))
          PY

      - name: Envoyer les notifications Firebase
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          TEST_NOTIFICATION: ${{ inputs.test_notification }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::Le secret FIREBASE_SERVICE_ACCOUNT est absent."
            exit 1
          fi

          echo "Installation de Firebase Admin SDK..."
          npm install --no-save --no-package-lock firebase-admin@14

          node <<'NODE'
          (async () => {
                    const fs = require("fs");
                    const { initializeApp, cert } = require("firebase-admin/app");
                    const { getFirestore, FieldValue } = require("firebase-admin/firestore");
                    const { getMessaging } = require("firebase-admin/messaging");
          
                    const serviceAccount = JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT);
                    initializeApp({ credential: cert(serviceAccount) });
          
                    const db = getFirestore();
                    const messaging = getMessaging();
          
                    const current = JSON.parse(fs.readFileSync("program.json", "utf8"));
          
                    let previous = { current: {}, next: {} };
                    try {
                      const raw = require("child_process")
                        .execFileSync("git", ["show", "HEAD:program.json"], { encoding: "utf8" });
                      previous = JSON.parse(raw);
                    } catch {
                      console.log("Pas de program.json précédent exploitable.");
                    }
          
                    const testMode = process.env.TEST_NOTIFICATION === "true";
          
                    function becameAvailable(oldItem, newItem) {
                      return Boolean(newItem?.available) &&
                        (!oldItem?.available || oldItem?.url !== newItem?.url);
                    }
          
                    let candidate = null;
          
                    if (becameAvailable(previous.current, current.current)) {
                      candidate = current.current;
                    } else if (becameAvailable(previous.next, current.next)) {
                      candidate = current.next;
                    }
          
                    const siteUrl = "https://linkbvian-hash.github.io/programme_mediatheque/";
          
                    if (testMode) {
                      candidate = {
                        label: "Test des notifications",
                        url: siteUrl,
                        test: true
                      };
                      console.log("Mode test activé.");
                    }
          
                    if (!candidate) {
                      console.log("Aucun nouveau programme détecté. Aucune notification envoyée.");
                      process.exit(0);
                    }
          
                    const notificationId = Buffer.from(
                      candidate.test ? "test-" + Date.now() : candidate.url
                    ).toString("base64url");
          
                    const stateRef = db.collection("sent_notifications").doc(notificationId);
          
                    if (!candidate.test) {
                      const state = await stateRef.get();
                      if (state.exists) {
                        console.log("Notification déjà envoyée pour " + candidate.url);
                        process.exit(0);
                      }
                    }
          
                    const snapshot = await db.collection("subscribers").get();
                    const subscriptions = [];
          
                    snapshot.forEach(doc => {
                      const data = doc.data();
                      if (typeof data.token === "string" && data.token.length > 0) {
                        subscriptions.push({ id: doc.id, token: data.token });
                      }
                    });
          
                    if (subscriptions.length === 0) {
                      console.log("Aucun appareil abonné.");
                      process.exit(0);
                    }
          
                    console.log(`Envoi vers ${subscriptions.length} appareil(s)...`);
          
                    const title = candidate.test
                      ? "🔔 Test des notifications"
                      : "📚 Nouveau programme disponible";
          
                    const body = candidate.test
                      ? "Si tu reçois cette notification, tout fonctionne !"
                      : `${candidate.label} est maintenant disponible.`;
          
                    const link = candidate.url || siteUrl;
                    let successCount = 0;
                    let failureCount = 0;
          
                    for (let i = 0; i < subscriptions.length; i += 500) {
                      const batch = subscriptions.slice(i, i + 500);
          
                      const messages = batch.map(item => ({
                        token: item.token,
                        notification: {
                          title,
                          body
                        },
                        webpush: {
                          notification: {
                            icon: `${siteUrl}assets/logo-boris-vian-icon-192.webp?v=14`
                          },
                          fcmOptions: {
                            link
                          }
                        }
                      }));
          
                      const response = await messaging.sendEach(messages);
          
                      successCount += response.successCount;
                      failureCount += response.failureCount;
          
                      for (let j = 0; j < response.responses.length; j++) {
                        const result = response.responses[j];
          
                        if (!result.success) {
                          const code = result.error?.code || "unknown";
                          const message = result.error?.message || "aucun détail";
                          console.log(`Échec ${batch[j].id}: ${code} — ${message}`);
          
                          if (
                            code === "messaging/registration-token-not-registered" ||
                            code === "messaging/invalid-registration-token"
                          ) {
                            await db.collection("subscribers").doc(batch[j].id).delete();
                            console.log(`Abonnement invalide supprimé: ${batch[j].id}`);
                          }
                        }
                      }
                    }
          
                    console.log(`Notifications envoyées: ${successCount}, échecs: ${failureCount}`);
          
                    if (successCount > 0 && !candidate.test) {
                      await stateRef.set({
                        url: candidate.url,
                        label: candidate.label,
                        sentAt: FieldValue.serverTimestamp(),
                        successCount,
                        failureCount
                      });
                      console.log("Notification enregistrée pour éviter les doublons.");
                    }
          
                    if (successCount === 0) {
                      process.exit(1);
                    }
                    
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Publier si modifié
        shell: bash
        run: |
          git config user.name "programme-mediatheque-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add program.json

          if git diff --cached --quiet; then
            echo "Aucun changement."
          else
            git commit -m "Mise à jour automatique des programmes"
            git push
          fi
